<svg xmlns="http://www.w3.org/2000/svg" width="1255" height="723" viewBox="0 0 1255 723" role="img" aria-labelledby="title desc">
  <title id="title">Rockwell mobile manipulator system architecture</title>
  <desc id="desc">ROS 2 component graph connecting the task orchestrator to navigation, docking, manipulation, telemetry, health monitoring, fault injection, Gazebo, and RViz.</desc>
  <defs>
    <marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
      <path d="M0 0 7 3.5 0 7z" fill="#c6ccd3"/>
    </marker>
    <style>
      .node{fill:#1f1f1f;stroke:#aeb4ba;stroke-width:1.2}
      .edge{fill:none;stroke:#c6ccd3;stroke-width:1.15;marker-end:url(#arrow)}
      .bi{fill:none;stroke:#c6ccd3;stroke-width:1.15;marker-start:url(#arrow);marker-end:url(#arrow)}
      .label{font:16px Arial,sans-serif;fill:#f3f6f8;text-anchor:middle}
      .edge-label{font:16px Arial,sans-serif;fill:#f3f6f8;text-anchor:middle}
      .label-bg{fill:#5b5b5b}
    </style>
  </defs>
  <rect width="1255" height="723" fill="#0d1117"/>

