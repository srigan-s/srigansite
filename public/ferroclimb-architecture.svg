<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FerroClimb closed-loop ROS 2 architecture</title>
  <desc id="desc">Gazebo Harmonic simulation feeds robot sensor data into state estimation, stability validation, gait control, ros2_control, and the hexapod. Adhesion, mission, safety, fault injection, and telemetry operate as independent supporting systems.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#c2410c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .group-title { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
      .node-title { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .node-sub { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
      .edge-label { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
      .node { fill: #ffffff; stroke-width: 1.5; filter: url(#shadow); }
      .primary { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .monitor { fill: none; stroke: #c2410c; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow-orange); }
      .telemetry { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 4 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#f8fafc"/>

  <g aria-label="Legend">
    <line x1="48" y1="34" x2="92" y2="34" class="primary"/>
    <text x="105" y="39" class="edge-label">primary control loop</text>
    <line x1="300" y1="34" x2="344" y2="34" class="monitor"/>
    <text x="357" y="39" class="edge-label">monitoring / faults / telemetry</text>
  </g>

  <rect x="24" y="66" width="300" height="628" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="346" y="66" width="508" height="628" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="876" y="66" width="300" height="628" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>

  <text x="46" y="98" class="group-title" fill="#1d4ed8">Gazebo Harmonic</text>
  <text x="368" y="98" class="group-title" fill="#15803d">ROS 2 Autonomy</text>
  <text x="898" y="98" class="group-title" fill="#c2410c">Safety &amp; Evaluation</text>

  <!-- Edges are drawn before nodes so labels and boxes remain crisp. -->
  <path d="M174 211V295" class="primary"/>
  <path d="M174 379V487" class="primary"/>
  <path d="M284 529H375" class="primary"/>
  <path d="M565 529H634" class="primary"/>
  <path d="M729 487V403" class="primary"/>
  <path d="M729 319V235" class="primary"/>
  <path d="M634 193C540 193 498 295 284 333" class="primary"/>

  <path d="M565 389C602 389 602 507 634 517" class="primary"/>
  <path d="M565 271H634" class="primary"/>

  <path d="M914 445C816 445 722 389 565 389" class="monitor"/>
  <path d="M565 529C720 529 770 214 914 214" class="monitor"/>
  <path d="M824 529C872 529 854 250 914 226" class="monitor"/>
  <path d="M565 389C754 389 790 238 914 238" class="monitor"/>
  <path d="M914 250C868 279 846 343 824 355" class="monitor"/>

  <path d="M565 541C722 572 796 579 914 579" class="telemetry"/>
  <path d="M824 541C856 551 875 563 914 579" class="telemetry"/>
  <path d="M1065 256V537" class="telemetry"/>
  <path d="M565 283C734 311 790 554 914 588" class="telemetry"/>

  <text x="435" y="516" class="edge-label">sensor state</text>
  <text x="585" y="374" class="edge-label">support valid</text>
  <text x="676" y="286" class="edge-label">joint targets</text>
  <text x="758" y="337" class="edge-label" fill="#c2410c">speed / hold / stop</text>
  <text x="748" y="432" class="edge-label" fill="#c2410c">magnet fault</text>

  <!-- Simulation nodes -->
  <g>
    <rect x="64" y="127" width="220" height="84" rx="10" class="node" stroke="#60a5fa"/>
    <text x="174" y="162" text-anchor="middle" class="node-title">Steel environment</text>
    <text x="174" y="185" text-anchor="middle" class="node-sub">floor + wall</text>
  </g>
  <g>
    <rect x="64" y="295" width="220" height="84" rx="10" class="node" stroke="#60a5fa"/>
    <text x="174" y="330" text-anchor="middle" class="node-title">18-DOF hexapod</text>
    <text x="174" y="353" text-anchor="middle" class="node-sub">six magnetic feet</text>
  </g>
  <g>
    <rect x="64" y="487" width="220" height="84" rx="10" class="node" stroke="#60a5fa"/>
    <text x="174" y="522" text-anchor="middle" class="node-title">Robot sensors</text>
    <text x="174" y="545" text-anchor="middle" class="node-sub">IMU · joints · contacts</text>
  </g>

  <!-- Autonomy nodes -->
  <g>
    <rect x="375" y="487" width="190" height="84" rx="10" class="node" stroke="#4ade80"/>
    <text x="470" y="522" text-anchor="middle" class="node-title">State estimator</text>
    <text x="470" y="545" text-anchor="middle" class="node-sub">pose + contact state</text>
  </g>
  <g>
    <rect x="634" y="487" width="190" height="84" rx="10" class="node" stroke="#4ade80"/>
    <text x="729" y="522" text-anchor="middle" class="node-title">Stability validator</text>
    <text x="729" y="545" text-anchor="middle" class="node-sub">support + margin</text>
  </g>
  <g>
    <rect x="634" y="319" width="190" height="84" rx="10" class="node" stroke="#4ade80"/>
    <text x="729" y="354" text-anchor="middle" class="node-title">Gait + transition</text>
    <text x="729" y="377" text-anchor="middle" class="node-sub">guarded foot release</text>
  </g>
  <g>
    <rect x="634" y="151" width="190" height="84" rx="10" class="node" stroke="#4ade80"/>
    <text x="729" y="186" text-anchor="middle" class="node-title">ros2_control</text>
    <text x="729" y="209" text-anchor="middle" class="node-sub">joint interfaces</text>
  </g>
  <g>
    <rect x="375" y="347" width="190" height="84" rx="10" class="node" stroke="#4ade80"/>
    <text x="470" y="382" text-anchor="middle" class="node-title">Adhesion manager</text>
    <text x="470" y="405" text-anchor="middle" class="node-sub">load · slip · reliability</text>
  </g>
  <g>
    <rect x="375" y="229" width="190" height="84" rx="10" class="node" stroke="#4ade80"/>
    <text x="470" y="264" text-anchor="middle" class="node-title">Mission manager</text>
    <text x="470" y="287" text-anchor="middle" class="node-sub">demo + recovery flow</text>
  </g>

  <!-- Assurance nodes -->
  <g>
    <rect x="914" y="172" width="224" height="84" rx="10" class="node" stroke="#fb923c"/>
    <text x="1026" y="207" text-anchor="middle" class="node-title">Safety supervisor</text>
    <text x="1026" y="230" text-anchor="middle" class="node-sub">slow · hold · recover · stop</text>
  </g>
  <g>
    <rect x="914" y="403" width="224" height="84" rx="10" class="node" stroke="#fb923c"/>
    <text x="1026" y="438" text-anchor="middle" class="node-title">Fault injector</text>
    <text x="1026" y="461" text-anchor="middle" class="node-sub">magnet failure scenarios</text>
  </g>
  <g>
    <rect x="914" y="537" width="224" height="84" rx="10" class="node" stroke="#fb923c"/>
    <text x="1026" y="572" text-anchor="middle" class="node-title">Telemetry + reports</text>
    <text x="1026" y="595" text-anchor="middle" class="node-sub">evaluation evidence</text>
  </g>
</svg>
