<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Robot">
  <defs>
    <linearGradient id="body" x1="16" y1="38" x2="46" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30383d"/>
      <stop offset="0.42" stop-color="#111619"/>
      <stop offset="1" stop-color="#050708"/>
    </linearGradient>
    <linearGradient id="shell" x1="19" y1="5" x2="47" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#394247"/>
      <stop offset="0.35" stop-color="#171d20"/>
      <stop offset="1" stop-color="#050708"/>
    </linearGradient>
    <radialGradient id="visor" cx="0" cy="0" r="1" gradientTransform="translate(26 13) rotate(51) scale(27 30)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20292d"/>
      <stop offset="0.48" stop-color="#090d0f"/>
      <stop offset="1" stop-color="#010203"/>
    </radialGradient>
    <linearGradient id="gloss" x1="20" y1="8" x2="38" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="eyeGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Tapered shoulder shell -->
  <path d="M24 37h16c6.3 1.4 11.5 6.2 14 13l-7.1 5.2L42.5 64h-21l-4.4-8.8L10 50c2.5-6.8 7.7-11.6 14-13Z" fill="url(#body)"/>
  <path d="M17.2 51.7c3.3-5 8.5-7.7 14.8-7.7s11.5 2.7 14.8 7.7" fill="none" stroke="#596267" stroke-opacity="0.42" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M27 35h10v7H27z" fill="#0a0e10" stroke="#30383d" stroke-width="1"/>

  <!-- Glossy oval head and visor -->
  <path d="M32 2.5c-12.3 0-20 7.4-20 18.2 0 11.7 8.6 18.5 20 18.5s20-6.8 20-18.5C52 9.9 44.3 2.5 32 2.5Z" fill="url(#shell)" stroke="#050708" stroke-width="1.5"/>
  <path d="M32 6.6c-10.3 0-16.2 5.7-16.2 14.2 0 9.1 6.9 14.3 16.2 14.3s16.2-5.2 16.2-14.3C48.2 12.3 42.3 6.6 32 6.6Z" fill="url(#visor)" stroke="#444f54" stroke-opacity="0.7" stroke-width="1"/>
  <path d="M20.1 17.5c1.5-5.2 5.8-8 12.2-8 3.4 0 6.2.8 8.3 2.3-4.5-.9-9.8-.2-14.1 1.9-2.8 1.3-4.8 2.8-6.4 3.8Z" fill="url(#gloss)"/>

  <!-- Teal LED eyes -->
  <g fill="#43f5cf" opacity="0.75" filter="url(#eyeGlow)">
    <circle cx="25.5" cy="22" r="2.7"/>
    <circle cx="38.5" cy="22" r="2.7"/>
  </g>
  <g fill="#7fffe4">
    <circle cx="25.5" cy="22" r="1.55"/>
    <circle cx="38.5" cy="22" r="1.55"/>
  </g>
</svg>
